[project]
name = "fraghub"
version = "2.0.0"
requires-python = ">=3.12"
# Seulement ce que le code importe directement ; uv installe le reste (dépendances des dépendances).
dependencies = [
    "fastapi",
    "fraghub-rust",
    "mzspeclib>=1.0.7",
    "psutil",
    "pydantic",
    "python-socketio",
    "uvicorn",
]

# Outils de compilation (installés aussi par `uv sync`) : maturin pour le moteur Rust,
# PyInstaller pour l'exécutable.
[dependency-groups]
dev = [
    "maturin>=1.5,<2.0",
    "pyinstaller",
]

[tool.uv.workspace]
members = [
    "scripts/fraghub_rust",
]

[tool.uv.sources]
fraghub-rust = { workspace = true }
