<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 600px;
            height: 750px;
            background: transparent; /* Fenêtre globale transparente */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            -webkit-app-region: drag;
            user-select: none;
        }

        #logo {
            width: 400px;
            /* L'image a environ 100 px de vide transparent sous le texte "FragHub" :
               marge négative pour le rapprocher de la roue (écart visible d'environ 50 px) */
            margin-bottom: -50px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.7; transform: scale(1); }
        }

        /* La roue identique au v-progress-circular */
        .spinner {
            width: 70px;
            height: 70px;
            border: 7px solid rgba(25, 118, 210, 0.2);
            border-top: 7px solid #1976D2;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Le fond blanc transparent sur le texte */
        #message {
            margin-top: 30px;
            font-size: 20px;
            font-weight: 600;
            color: #424242;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.7); /* Fond blanc transparent */
            backdrop-filter: blur(5px);           /* Effet flou moderne */
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<img id="logo" src="" alt="FragHub" />
<div class="spinner"></div>
<div id="message">Starting FragHub…</div>

<script>
    window.setSplashMessage = (msg) => {
        document.getElementById('message').textContent = msg;
    };
</script>
</body>
</html>
